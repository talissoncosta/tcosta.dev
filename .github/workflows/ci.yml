name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check

      - name: Registry JSON is up to date
        run: |
          yarn registry:build
          git diff --exit-code -- public/r || (echo "Run 'yarn registry:build' and commit public/r." && exit 1)

      - run: yarn build
